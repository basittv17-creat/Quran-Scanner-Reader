name: Android checks and APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify source and pinned dependencies
        run: python3 tools/check_source_policy.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate Quran project source and timing pack logic
        run: python3 tools/verify_phase8.py
      - name: Test OCR benchmark metric calculations
        run: python3 tools/test_ocr_benchmark.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner already provides Android SDK tooling.
      # android-actions/setup-android@v3 attempts to install the removed
      # SDK 'tools' package and fails before compilation.
      - name: Check Android SDK availability
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Kotlin, process resources, test and lint
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:processDebugResources :app:testDebugUnitTest :app:lintDebug
      - name: Report unit tests and lint findings
        if: always()
        run: python3 tools/report_ci_results.py
      - name: Build a single Android debug APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK output and signature
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mapfile -t packages < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \))
          apk=app/build/outputs/apk/debug/app-debug.apk
          test "${#packages[@]}" -eq 1
          test "${packages[0]}" = "$apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify "$apk"
      - name: Upload Quran Scanner Reader APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quran-scanner-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
